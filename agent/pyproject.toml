[project]
name = "ws-agent"
version = "0.1.0"
description = "Workspace information agent (read-only, project-scoped)"
requires-python = ">=3.11"
dependencies = [
    "google-adk==1.28.1",
    "google-cloud-aiplatform[adk,agent_engines]>=1.71.0",
    "google-cloud-secret-manager>=2.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "scripts"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
