<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WS Agent</title>
<style>
  :root { --fg: #1f2430; --sub: #565d6e; --bg: #fbfaf7; --line: #e4e1d8; --accent: #35508c;
          --paper: #fff; --side: 34%; --drive: #1a8f5c; --backlog: #6a54a3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: 'Hiragino Sans', system-ui, sans-serif; background: var(--bg);
         color: var(--fg); display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--paper); flex: none; }
  header h1 { font-size: 15px; margin: 0; }
  #projects { font-size: 12px; color: var(--sub); }
  #projects span { border: 1px solid var(--line); padding: 2px 8px; margin-left: 4px; border-radius: 2px; }
  #newconv { margin-left: auto; font-size: 12px; background: none; border: 1px solid var(--line);
             color: var(--sub); border-radius: 4px; padding: 3px 10px; cursor: pointer; height: auto; }

  /* Two panes: document left, composer right. The launcher is the same
     composer with the document pane collapsed, so the transition is a morph. */
  #workspace { flex: 1; display: flex; min-height: 0; }
  #leftpane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #docpane { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 32px 40px;
             opacity: 1; transition: opacity .35s ease; }
  #splitter { flex: none; width: 6px; cursor: col-resize; background: transparent;
              border-left: 1px solid var(--line); transition: opacity .35s ease; }
  #splitter:hover, #splitter.dragging { background: var(--accent); opacity: .25; }
  #sidepane { flex: none; width: var(--side); min-width: 260px; max-width: 400px; background: var(--paper);
              display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; overflow-y: auto;
              transition: width .45s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  body.launcher #docpane { flex: 0 1 0; opacity: 0; padding: 0; overflow: hidden; }
  body.launcher #splitter { opacity: 0; pointer-events: none; }
  body.launcher #sidepane { width: 0; min-width: 0; max-width: 0; opacity: 0;
                            padding: 0; overflow: hidden; pointer-events: none; }
  body.launcher #composer { flex: 1; justify-content: center; align-items: center;
                            border-top: 0; background: var(--bg); padding: 24px; }
  body.launcher #composer > * { max-width: min(820px, 76vw); width: 100%; }
  body.launcher #lead { display: block; }
  body.launcher #examples { display: flex; }
  body.launcher #launchAnchors { display: flex; }
  #lead { display: none; font-size: 17px; font-weight: 600; text-align: center; margin: 0 0 4px; }
  #launchAnchors { display: none; flex-wrap: wrap; gap: 5px; justify-content: center; }
  #examples { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; }

  /* composer: lives at the foot of the reading pane */
  #composer { flex: none; display: flex; flex-direction: column; gap: 8px;
              padding: 12px 32px 14px; background: var(--paper);
              border-top: 1px solid var(--line); transition: padding .35s ease; }
  #composer > .actions, #composer > textarea { max-width: 82em; width: 100%; margin: 0 auto; }
  textarea { resize: none; font: inherit; padding: 11px 12px; border: 1px solid var(--line);
             border-radius: 6px; line-height: 1.7; background: var(--paper);
             min-height: 5.6em; transition: min-height .3s ease, box-shadow .2s ease; }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(53,80,140,.12); }
  body.launcher textarea { min-height: 7.5em; font-size: 15px; }
  .actions { display: flex; align-items: center; gap: 10px; }
  .hint { font-size: 11px; color: var(--sub); }
  button.send { font: inherit; padding: 7px 20px; border: 0; border-radius: 5px;
                background: var(--accent); color: #fff; cursor: pointer; margin-left: auto; }
  button.send:disabled { opacity: .5; cursor: default; }

  /* anchors */
  .label { font-size: 11px; color: var(--sub); letter-spacing: .04em; }
  #anchors { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
          background: var(--bg); border-radius: 11px; padding: 2px 9px; font-size: 11.5px; color: var(--sub); }
  .chip a { color: var(--fg); text-decoration: none; }
  .chip a:hover { text-decoration: underline; }
  .chip .src { width: 7px; height: 7px; flex: none; }
  .src.drive { background: var(--drive); border-radius: 2px; }
  .src.backlog { background: var(--backlog); border-radius: 50%; }
  .src.other { background: var(--sub); border-radius: 1px; transform: rotate(45deg); }
  .chip button, .addAnchor { all: unset; cursor: pointer; color: var(--sub); }
  .chip button { margin-left: 2px; }
  .addAnchor { color: var(--accent); padding: 2px 8px; font-size: 11.5px; }
  #examples .chip { cursor: pointer; }
  #examples .chip:hover { border-color: var(--accent); color: var(--fg); }

  #records { display: flex; flex-direction: column; gap: 4px; }
  #records .chip { max-width: 100%; }
  #records .chip a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* history index */
  #history { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  #history a { color: var(--sub); text-decoration: none; padding: 2px 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #history a:hover, #history a.current { color: var(--accent); }

  /* messages */
  #log { max-width: 82em; margin: 0 auto; }
  .msg { margin: 0 0 18px; line-height: 1.85; font-size: 14px; }
  .msg.user { font-weight: 600; border-left: 3px solid var(--accent); padding-left: 12px; }
  .msg.user p { margin: .2em 0; }
  .msg.agent > div { background: var(--paper); border: 1px solid var(--line); padding: 14px 18px;
                     border-radius: 6px; }
  .msg.agent a { color: var(--accent); }
  .msg.agent p, .msg.agent ul, .msg.agent ol { margin: .45em 0; }
  .msg.agent h3, .msg.agent h4 { margin: .9em 0 .35em; font-size: 15px; }
  .msg.agent table { border-collapse: collapse; font-size: 13px; }
  .msg.agent th, .msg.agent td { border: 1px solid var(--line); padding: 5px 9px; }
  .msg.agent pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 4px; }
  .tablewrap { overflow-x: auto; }

  .wait { color: var(--sub); font-size: 13px; }
  .wait i { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%;
            background: var(--sub); animation: wait 1.2s infinite ease-in-out; }
  .wait b { font-weight: normal; margin-left: 6px; }
  .wait i:nth-child(2) { animation-delay: .2s; }
  .wait i:nth-child(3) { animation-delay: .4s; }
  @keyframes wait { 0%, 80%, 100% { opacity: .25; transform: translateY(0); }
                    40% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) {
    #docpane, #sidepane, #splitter, textarea { transition: none; }
    .wait i { animation: none; }
  }

  @media (max-width: 820px) {
    #workspace { flex-direction: column; }
    #splitter { display: none; }
    #sidepane { width: 100%; min-width: 0; max-width: none; border-top: 1px solid var(--line);
                max-height: 38vh; order: 2; }
    #composer { padding: 10px 16px 12px; }
    #docpane { padding: 16px 16px 24px; }
  }
</style>
</head>
<body class="launcher">
<header>
  <h1>WS Agent</h1><div id="projects"></div>
  <button id="newconv" type="button">新しい会話</button>
</header>

<div id="workspace">
  <div id="leftpane">
    <main id="docpane"><div id="log"></div><div id="spacer"></div></main>
    <form id="composer">
      <p id="lead">所属プロジェクトの記録を横断して調べます</p>
      <textarea id="input" placeholder="例) {機能名}のリリース起因の障害について、経緯と原因、改善提案の順に分析してください"></textarea>
      <div class="actions">
        <span class="hint">⌘/Ctrl + Enter で送信</span>
        <button id="send" class="send" type="submit">送信</button>
      </div>
      <div id="examples"></div>
      <div id="launchAnchors"></div>
    </form>
  </div>
  <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-label="幅を調整"></div>
  <aside id="sidepane">
    <div class="label">参照の基点</div>
    <div id="anchors"></div>
    <div class="label" id="histLabel" hidden style="margin-top:6px;">この会話</div>
    <nav id="history"></nav>
    <div class="label" id="recLabel" hidden style="margin-top:6px;">参照した記録</div>
    <div id="records"></div>
  </aside>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
let conv = crypto.randomUUID(); // one conversation per page load / new conversation
const log = document.getElementById("log");
const docpane = document.getElementById("docpane");
const input = document.getElementById("input");
const send = document.getElementById("send");
const historyNav = document.getElementById("history");
const spacer = document.getElementById("spacer");
const recordsBox = document.getElementById("records");

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.tagName === "A") {
    node.setAttribute("target", "_blank");
    node.setAttribute("rel", "noopener");
  }
});
function md(s) {
  return DOMPurify.sanitize(marked.parse(s, { gfm: true, breaks: true }));
}

// --- anchors: user-visible reference points sent with every message ---
let anchors = [];
function sourceOf(url) {
  if (/backlog\.(jp|com)/.test(url)) return "backlog";
  if (/docs\.google\.com|drive\.google\.com/.test(url)) return "drive";
  return "other";
}
const SOURCE_LABEL = { drive: "Google Drive", backlog: "Backlog", other: "リンク" };
function loadAnchors(defaults) {
  try {
    const saved = JSON.parse(localStorage.getItem("ws-anchors"));
    if (Array.isArray(saved)) return saved;
  } catch {}
  return defaults || [];
}
function saveAnchors() { localStorage.setItem("ws-anchors", JSON.stringify(anchors)); }
function renderAnchors() {
  for (const bar of [document.getElementById("anchors"),
                     document.getElementById("launchAnchors")]) {
    renderAnchorsInto(bar);
  }
}
function renderAnchorsInto(bar) {
  bar.innerHTML = "";
  anchors.forEach((a, i) => {
    const kind = sourceOf(a.url);
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML =
      `<span class="src ${kind}" title="${SOURCE_LABEL[kind]}"></span>` +
      `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>` +
      `<button type="button" title="削除">×</button>`;
    chip.querySelector("button").onclick = () => { anchors.splice(i, 1); saveAnchors(); renderAnchors(); };
    bar.appendChild(chip);
  });
  const add = document.createElement("button");
  add.className = "addAnchor"; add.type = "button"; add.textContent = "+ 追加";
  add.onclick = () => {
    const name = prompt("名前(例: 定例議事録)"); if (!name) return;
    const url = prompt("URL"); if (!url) return;
    anchors.push({ name: name.trim(), url: url.trim() }); saveAnchors(); renderAnchors();
  };
  bar.appendChild(add);
}

// --- example prompts: one per kind of inquiry, filled into the composer ---
// [label, template]: {} marks the part to fill in, selected on insert.
const EXAMPLES = [
  ["最新の仕様", "{機能名}の現在の仕様を教えてください"],
  ["経緯をたどる", "{機能名や課題キー}について、経緯と原因を時系列で整理してください"],
  ["進捗の把握", "{機能名}の開発の進捗状況を教えてください"],
  ["課題の傾向", "ここ数ヶ月の課題の傾向を分析してください"],
  ["直近の話題", "最近の定例で話題に上がっていることをまとめてください"],
  ["決定と宿題", "直近で決まったことと、残っている確認事項・次のアクションを整理してください"],
];
function renderExamples() {
  const box = document.getElementById("examples");
  box.innerHTML = "";
  for (const [label, text] of EXAMPLES) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = label;
    chip.onclick = () => {
      const open = text.indexOf("{"), close = text.indexOf("}");
      input.value = text.replace(/[{}]/g, "");
      input.focus();
      if (open >= 0) input.setSelectionRange(open, close - 1);
      autosize(); updateSend();
    };
    box.appendChild(chip);
  }
}

fetch("/api/me").then(r => r.ok ? r.json() : Promise.reject(r.status)).then(me => {
  document.getElementById("projects").innerHTML =
    me.projects.map(p => `<span>${esc(p)}</span>`).join("");
  anchors = loadAnchors(me.anchors);
  renderAnchors();
}).catch(() => {
  document.body.classList.remove("launcher");
  append("agent", "アクセス権がありません。管理者に連絡してください。");
});
renderExamples();

// --- split ratio, draggable ---
const savedSide = localStorage.getItem("ws-side");
if (savedSide) document.documentElement.style.setProperty("--side", savedSide);
const splitter = document.getElementById("splitter");
function setSide(px) {
  const pct = Math.min(60, Math.max(22, (1 - px / window.innerWidth) * 100));
  document.documentElement.style.setProperty("--side", pct.toFixed(1) + "%");
  localStorage.setItem("ws-side", pct.toFixed(1) + "%");
}
splitter.addEventListener("pointerdown", (e) => {
  if (document.body.classList.contains("launcher")) return;
  splitter.setPointerCapture(e.pointerId);
  splitter.classList.add("dragging");
  const move = (ev) => setSide(ev.clientX);
  const up = () => {
    splitter.classList.remove("dragging");
    splitter.removeEventListener("pointermove", move);
    splitter.removeEventListener("pointerup", up);
  };
  splitter.addEventListener("pointermove", move);
  splitter.addEventListener("pointerup", up);
});
splitter.addEventListener("keydown", (e) => {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--side"));
  if (e.key === "ArrowLeft") setSide(window.innerWidth * (1 - (cur + 2) / 100));
  if (e.key === "ArrowRight") setSide(window.innerWidth * (1 - (cur - 2) / 100));
});

// --- messages ---
let turn = 0;
function append(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div>${md(text)}</div>`;
  log.appendChild(div);
  return div;
}
// Keep the newest exchange at the top of the reading pane: a tail spacer
// guarantees there is room to scroll it up there.
function pinToTop(el) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    spacer.style.height = Math.max(0, docpane.clientHeight - 140) + "px";
    docpane.scrollTop = el.offsetTop - docpane.offsetTop - 8;
  }));
}

function addHistory(text, anchorId) {
  turn += 1;
  const a = document.createElement("a");
  a.href = "#" + anchorId;
  a.textContent = turn + ". " + text.replace(/[#*`>\-]/g, "").trim().slice(0, 40);
  a.onclick = (e) => {
    e.preventDefault();
    pinToTop(document.getElementById(anchorId));
  };
  historyNav.querySelectorAll("a").forEach(x => x.classList.remove("current"));
  a.classList.add("current");
  historyNav.appendChild(a);
  document.getElementById("histLabel").hidden = false;
}

const SOURCE = { slack: "Slack", drive: "Google Drive",
                 github: "GitHub", backlog: "Backlog" };
function progress(names) {
  const seen = [];
  for (const n of names) {
    for (const key in SOURCE) {
      if (n.includes(key) && !seen.includes(SOURCE[key])) seen.push(SOURCE[key]);
    }
  }
  const verb = names.every(n => n.startsWith("search")) ? "を検索中" : "を読み込み中";
  return `<span class="wait"><i></i><i></i><i></i><b>${esc(seen.join(" / "))}${verb}</b></span>`;
}

let seenRecords = new Set();
function addRecords(list) {
  for (const r of list) {
    if (seenRecords.has(r.url)) continue;
    seenRecords.add(r.url);
    const kind = sourceOf(r.url);
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span class="src ${kind}" title="${SOURCE_LABEL[kind]}"></span>` +
      `<a href="${esc(r.url)}" target="_blank" rel="noopener" title="${esc(r.title || r.name || r.url)}">${esc(r.name || r.title || r.url)}</a>`;
    recordsBox.appendChild(chip);
  }
  document.getElementById("recLabel").hidden = recordsBox.childElementCount === 0;
}

document.getElementById("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;

  document.body.classList.remove("launcher");
  const userDiv = append("user", message);
  const anchorId = "t" + (turn + 1);
  userDiv.id = anchorId;
  addHistory(message, anchorId);
  input.value = "";
  autosize();
  send.disabled = true;
  const agentDiv = append("agent", "");
  agentDiv.firstChild.innerHTML = '<span class="wait"><i></i><i></i><i></i></span>';
  pinToTop(userDiv);

  let acc = "";
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, conv, anchors }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const f of frames) {
        const data = f.replace(/^data: /, "");
        if (data === "[DONE]") continue;
        const ev = JSON.parse(data);
        if (ev.records) { addRecords(ev.records); continue; }
        if (ev.tools) {
          // A retrieval round begins: text streamed so far was narration.
          acc = "";
          agentDiv.firstChild.innerHTML = progress(ev.tools);
          continue;
        }
        if (ev.error) acc += `\n(エラー: ${ev.error})`;
        if (ev.text) acc += ev.text;
        agentDiv.firstChild.innerHTML = md(acc);
      }
    }
  } catch {
    agentDiv.firstChild.innerHTML = md(acc + "\n(通信エラー)");
  } finally {
    updateSend();
    input.focus();
  }
});

document.getElementById("newconv").onclick = () => {
  conv = crypto.randomUUID();
  turn = 0;
  log.innerHTML = "";
  historyNav.innerHTML = "";
  recordsBox.innerHTML = "";
  seenRecords = new Set();
  document.getElementById("histLabel").hidden = true;
  document.getElementById("recLabel").hidden = true;
  spacer.style.height = "0px";
  input.value = "";
  autosize();
  document.body.classList.add("launcher");
  input.focus();
};

function autosize() {
  input.style.height = "auto";
  const cap = document.body.classList.contains("launcher") ? 0.45 : 0.35;
  input.style.height = Math.min(input.scrollHeight + 2, window.innerHeight * cap) + "px";
}
function updateSend() { send.disabled = !input.value.trim(); }
input.addEventListener("input", () => { autosize(); updateSend(); });
updateSend();
// Send with Cmd/Ctrl+Enter only; plain Enter keeps its native behavior
// (newline), so IME composition never interacts with sending at all.
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    send.click();
  }
});
input.focus();
</script>
</body>
</html>
